<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="dis-result">
      <h2>RESULT!!</h2>
      <h4>WPM: <span></span> </h4>
      <h5>Correct Words: <span></span></h5>
    </div>
    <div class="main-body">
      <div class="Lside">
        <h4>missed/wrong words:</h4>
        <br />
        <span></span><br />
      </div>

      <div class="container">
        <div class="timer">
          <h3>TIMER: <span>0</span></h3>
        </div>

        <div class="box">
          <p>words gonna appear here:</p>
        </div>

        <div class="typezone">
          <input type="text" placeholder="type here" , required />
        </div>

        <div class="startBtn">
          <button>START</button>
        </div>

        <div class="counter">
          <h3 class="count">count: 0</h3>
        </div>

      </div>

      <div class="Rside">
        <h4>correct words:</h4>
        <br />
        <span></span>
      </div>
    </div>



    <script src="script.js"></script>
  </body>
</html>
